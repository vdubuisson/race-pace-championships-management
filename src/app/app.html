<tui-root>
  <tui-loader
    [loading]="globalLoader.isLoading()"
    size="xl"
    [overlay]="true"
    [textContent]="globalLoader.text()"
    [class.more-visible]="globalLoader.moreVisible()"
  >
    <app-menu>
      <div class="container">
        <router-outlet />
      </div>
    </app-menu>
  </tui-loader>
</tui-root>
