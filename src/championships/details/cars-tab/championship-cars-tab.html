@for (category of championship().categories; track category) {
  @let categoryCars = carsByCategory().get(category) ?? [];
  <h2 tuiHeader class="tab-header">
    <span>{{ category | vehicleClassName }}</span>
    <div class="separator"></div>
    <span tuiSubtitle>{{ categoryCars.length }}/{{ cars().length }} cars</span>
  </h2>

  <div class="cars-list">
    @for (car of categoryCars; track car.id) {
      <app-car-card [car]="car" [isMod]="isCarsMods().get(car.id!) ?? false" />
    }
  </div>
}
