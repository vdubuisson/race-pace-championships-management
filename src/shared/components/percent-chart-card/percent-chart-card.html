<div tuiCardLarge appearance="floating" class="chart-card">
  <header tuiHeader>
    <h2 tuiTitle>{{ title() }}</h2>
    @if (tooltip()) {
      <aside tuiAccessories>
        <tui-icon [tuiTooltip]="tooltip()" />
      </aside>
    }
  </header>
  <section tuiCell>
    <tui-arc-chart [value]="[value() ?? 0]" [max]="1">
      {{ (value() | percent) ?? 'Not set' }}
    </tui-arc-chart>
  </section>
</div>
