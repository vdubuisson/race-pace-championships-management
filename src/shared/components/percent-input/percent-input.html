<div class="form-field">
  <label tuiLabel>
    <span>
      {{ title() }}
      @if (tooltip()) {
        <tui-icon [tuiTooltip]="tooltip()" />
      }
    </span>
    <tui-textfield [tuiTextfieldSize]="size()">
      <input
        tuiInputSlider
        [min]="0"
        [max]="100"
        [step]="1"
        [(ngModel)]="value"
        [ngModelOptions]="{ standalone: true }"
        postfix="%"
        placeholder="0%"
      />
      <input tuiSlider type="range" />
    </tui-textfield>
  </label>
  @for (error of errors(); track error) {
    <tui-error [error]="error.message!" />
  }
</div>
