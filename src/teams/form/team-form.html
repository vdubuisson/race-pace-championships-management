<a
  [routerLink]="['/teams']"
  appearance="outline"
  iconStart="@tui.chevron-left"
  size="xs"
  tuiButton
  class="back-btn"
>
  Back
</a>

<form tuiForm [formRoot]="teamForm">
  <header tuiHeader>
    <h1 tuiTitle>{{ pageTitle() }}</h1>
  </header>

  <fieldset>
    <div class="form-field">
      <label tuiLabel>
        Name
        <tui-textfield tuiTextfieldSize="m">
          <input tuiInput placeholder="Racing Team" [formField]="teamForm.name" />
        </tui-textfield>
      </label>
      <tui-error [formField]="teamForm.name" />
    </div>

    <div class="form-field">
      <label tuiLabel>
        Principal
        <tui-textfield tuiTextfieldSize="m">
          <input tuiInput placeholder="John Smith" [formField]="teamForm.principal" />
        </tui-textfield>
      </label>
      <tui-error [formField]="teamForm.principal" />
    </div>
  </fieldset>

  <fieldset>
    <app-percent-input
      title="Driver loyalty"
      [formField]="teamForm.driver_loyalty"
      [tooltip]="loyaltyTooltip"
    />

    <app-percent-input
      title="Expectation level"
      [formField]="teamForm.expectation_level"
      [tooltip]="expectationLevelTooltip"
    />

    <app-percent-input
      title="Performance rating"
      [formField]="teamForm.performance_rating"
      [tooltip]="performanceRatingTooltip"
    />
  </fieldset>

  <fieldset>
    <app-percent-input
      title="Engineering weight"
      [formField]="teamForm.engineering_weight"
      [tooltip]="engineeringTooltip"
    />

    <app-percent-input
      title="Engineering drag"
      [formField]="teamForm.engineering_drag"
      [tooltip]="engineeringTooltip"
    />

    <app-percent-input
      title="Engineering power"
      [formField]="teamForm.engineering_power"
      [tooltip]="engineeringTooltip"
    />
  </fieldset>

  <button tuiButton type="submit" size="m" [disabled]="teamForm().invalid()">Save</button>
</form>
